[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-operations-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery",
    "google-genai",
    "numpy",
    "sentence-transformers",
    "mcp[cli]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]